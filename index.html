<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EIA Oljelagre</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 { font-size: 1.4rem; font-weight: 600; color: #f1f5f9; }
    header span { font-size: 0.8rem; color: #64748b; margin-left: auto; }

    .badge {
      background: #1e3a5f;
      color: #60a5fa;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid #2563eb55;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 2rem;
      align-items: center;
    }

    .controls label { font-size: 0.85rem; color: #94a3b8; }

    select {
      background: #1e2235;
      border: 1px solid #2d3148;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 0.45rem 0.9rem;
      font-size: 0.875rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    select:hover { border-color: #4f6ef7; }

    .mode-toggle {
      display: flex;
      border: 1px solid #2d3148;
      border-radius: 6px;
      overflow: hidden;
      margin-left: auto;
    }

    .mode-toggle button {
      background: #1e2235;
      border: none;
      color: #64748b;
      padding: 0.45rem 1.1rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .mode-toggle button:not(:last-child) { border-right: 1px solid #2d3148; }
    .mode-toggle button.active { background: #3b5bdb; color: #fff; font-weight: 600; }
    .mode-toggle button:not(.active):hover { background: #252840; color: #e2e8f0; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }

    .stat-card .label {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }

    .stat-card .value { font-size: 1.6rem; font-weight: 700; color: #f1f5f9; }
    .stat-card .sub { font-size: 0.8rem; margin-top: 0.25rem; }

    .sub.up   { color: #4ade80; }
    .sub.down { color: #f87171; }
    .sub.flat { color: #94a3b8; }

    .chart-card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .chart-card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 1rem;
    }

    .chart-wrap { position: relative; height: 360px; }

    .status {
      text-align: center;
      padding: 3rem 1rem;
      color: #475569;
      font-size: 0.9rem;
    }

    .spinner {
      display: inline-block;
      width: 28px; height: 28px;
      border: 3px solid #2d3148;
      border-top-color: #4f6ef7;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 0.75rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: #2d1515;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<header>
  <span class="badge">EIA</span>
  <h1>Oljelagre — USA</h1>
  <span>Kilde: U.S. Energy Information Administration</span>
</header>

<main>
  <div class="controls">
    <label for="seriesSel">Serie:</label>
    <select id="seriesSel" onchange="loadData()">
      <option value="WCRSTUS1">Råoljelager totalt (inkl. SPR)</option>
      <option value="WCESTUS1" selected>Råoljelager (ekskl. SPR)</option>
      <option value="WCSSTUS1">Strategisk petroleumsreserve (SPR)</option>
      <option value="WGRSTUS1">Totalt bensinlager</option>
      <option value="WDISTUS1">Destillatlager (diesel/fyringsolje)</option>
      <option value="WKJSTUS1">Flydrivstofflager</option>
    </select>

    <label for="yearsSel" id="yearsLabel">Historisk band:</label>
    <select id="yearsSel" onchange="onYearsChange()">
      <option value="3">3 år</option>
      <option value="5" selected>5 år</option>
      <option value="10">10 år</option>
    </select>

    <div class="mode-toggle">
      <button id="btnSeasonal" class="active" onclick="setMode('seasonal')">Sesongalt</button>
      <button id="btnHistoric" onclick="setMode('historic')">Historisk</button>
    </div>
  </div>

  <div id="errorBox" style="display:none"></div>

  <div class="grid">
    <div class="stat-card">
      <div class="label">Siste verdi</div>
      <div class="value" id="statLast">—</div>
      <div class="sub flat" id="statDate">laster…</div>
    </div>
    <div class="stat-card">
      <div class="label">Endring uke/uke</div>
      <div class="value" id="statWow">—</div>
      <div class="sub flat" id="statWowPct"></div>
    </div>
    <div class="stat-card">
      <div class="label">vs. historisk snitt</div>
      <div class="value" id="statAvg">—</div>
      <div class="sub flat" id="statAvgDiff"></div>
    </div>
    <div class="stat-card">
      <div class="label">Historisk band (denne uke)</div>
      <div class="value" id="statMax">—</div>
      <div class="sub flat" id="statMin"></div>
    </div>
  </div>

  <div class="chart-card">
    <h2 id="chartTitle">Laster…</h2>
    <div class="chart-wrap">
      <div class="status" id="loadingMsg"><div class="spinner"></div><br>Henter data fra EIA…</div>
      <canvas id="mainChart" style="display:none"></canvas>
    </div>
  </div>

  <div class="chart-card">
    <h2>Uke-over-uke endring — inneværende år (tusen fat)</h2>
    <div class="chart-wrap" style="height:220px">
      <canvas id="deltaChart" style="display:none"></canvas>
    </div>
  </div>
</main>

<script>
const API_KEY = 'dmZglvmWG86ewOel1qYABoroVEnhGjUNTiHU4Rki';

const SERIES_LABELS = {
  WCRSTUS1: 'Råoljelager totalt (inkl. SPR)',
  WCESTUS1: 'Råoljelager (ekskl. SPR)',
  WCSSTUS1: 'Strategisk petroleumsreserve (SPR)',
  WGRSTUS1: 'Totalt bensinlager',
  WDISTUS1: 'Destillatlager',
  WKJSTUS1: 'Flydrivstofflager',
};

let mainChart  = null;
let deltaChart = null;
let cachedData = null;   // raw sorted array, reused on mode switch
let chartMode  = 'seasonal';

function fmt(n) {
  if (n == null || isNaN(n)) return '—';
  return n.toLocaleString('no-NO', { maximumFractionDigits: 0 });
}

function sign(n) { return n >= 0 ? '+' : ''; }

function weekOfYear(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const jan1 = new Date(y, 0, 1);
  return Math.floor((date - jan1) / (7 * 24 * 60 * 60 * 1000));
}

// Re-render from cache when mode or years changes (no new fetch needed)
function setMode(mode) {
  chartMode = mode;
  document.getElementById('btnSeasonal').classList.toggle('active', mode === 'seasonal');
  document.getElementById('btnHistoric').classList.toggle('active', mode === 'historic');
  document.getElementById('yearsLabel').textContent =
    mode === 'seasonal' ? 'Historisk band:' : 'Vis historikk:';
  if (cachedData) renderAll();
}

function onYearsChange() {
  // Historical mode: may need more data than cached — re-fetch.
  // Seasonal mode: always re-fetch (band width changes).
  loadData();
}

async function loadData() {
  const series   = document.getElementById('seriesSel').value;
  const yearsBack = parseInt(document.getElementById('yearsSel').value, 10);

  showLoading(true);
  hideError();

  try {
    const url = buildUrl(series, (yearsBack + 2) * 52);
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json = await resp.json();

    const raw = json?.response?.data;
    if (!raw || raw.length === 0) throw new Error('Ingen data returnert fra EIA.');

    cachedData = raw
      .map(d => ({ date: d.period, value: parseFloat(d.value) }))
      .filter(d => !isNaN(d.value))
      .sort((a, b) => a.date.localeCompare(b.date));

    renderAll();
    showLoading(false);
  } catch (err) {
    showError(err.message);
    showLoading(false);
  }
}

function renderAll() {
  const series    = document.getElementById('seriesSel').value;
  const yearsBack = parseInt(document.getElementById('yearsSel').value, 10);
  const label     = SERIES_LABELS[series] || series;
  const seasonal  = buildSeasonalData(cachedData, yearsBack);

  renderStats(seasonal);
  renderDeltaChart(seasonal.currentYearArr);

  if (chartMode === 'seasonal') {
    renderSeasonalChart(seasonal, label);
  } else {
    renderHistoricChart(cachedData, label, yearsBack);
  }
}

function buildUrl(series, weeks) {
  const toISO = d => d.toISOString().slice(0, 10);
  const end   = new Date();
  const start = new Date();
  start.setDate(start.getDate() - weeks * 7);

  const params = new URLSearchParams({
    api_key: API_KEY,
    frequency: 'weekly',
    'data[0]': 'value',
    'facets[series][]': series,
    start: toISO(start),
    end: toISO(end),
    'sort[0][column]': 'period',
    'sort[0][direction]': 'desc',
    length: 5000,
    offset: 0,
  });

  return `https://api.eia.gov/v2/petroleum/stoc/wstk/data/?${params}`;
}

function buildSeasonalData(data, yearsBack) {
  const currentYear = new Date().getFullYear();

  const byYearWeek = {};
  for (const d of data) {
    const y  = parseInt(d.date.slice(0, 4));
    const wi = weekOfYear(d.date);
    if (wi < 0 || wi > 51) continue;
    if (!byYearWeek[y]) byYearWeek[y] = {};
    byYearWeek[y][wi] = d.value;
  }

  const prevYears = [];
  for (let y = currentYear - 1; y >= currentYear - yearsBack; y--) {
    if (byYearWeek[y]) prevYears.push(y);
  }

  const minBand = [], maxBand = [], avgBand = [];
  for (let w = 0; w < 52; w++) {
    const vals = prevYears.map(y => byYearWeek[y]?.[w]).filter(v => v != null);
    if (!vals.length) { minBand.push(null); maxBand.push(null); avgBand.push(null); }
    else {
      minBand.push(Math.min(...vals));
      maxBand.push(Math.max(...vals));
      avgBand.push(vals.reduce((s, v) => s + v, 0) / vals.length);
    }
  }

  const currentLine = Array.from({ length: 52 }, (_, w) =>
    byYearWeek[currentYear]?.[w] ?? null
  );

  const xLabels = Array.from({ length: 52 }, (_, w) => {
    const d = new Date(currentYear, 0, 1 + w * 7);
    return d.toLocaleDateString('no-NO', { month: 'short', day: 'numeric' });
  });

  const currentYearArr = data
    .filter(d => d.date.startsWith(String(currentYear)))
    .sort((a, b) => a.date.localeCompare(b.date));

  return { currentLine, minBand, maxBand, avgBand, xLabels, currentYear, prevYears, currentYearArr };
}

function renderStats(s) {
  const arr  = s.currentYearArr;
  const last = arr[arr.length - 1];
  const prev = arr[arr.length - 2];

  document.getElementById('statLast').textContent = fmt(last?.value);
  document.getElementById('statDate').textContent  = last?.date ?? '';

  if (last && prev) {
    const diff = last.value - prev.value;
    const pct  = (diff / prev.value) * 100;
    document.getElementById('statWow').textContent    = `${sign(diff)}${fmt(diff)}`;
    document.getElementById('statWowPct').textContent = `${sign(pct)}${pct.toFixed(2)} %`;
    document.getElementById('statWow').className      = 'value';
    document.getElementById('statWowPct').className   = `sub ${diff >= 0 ? 'up' : 'down'}`;
  }

  if (last) {
    const wi  = weekOfYear(last.date);
    const avg = s.avgBand[wi];
    if (avg != null) {
      const diff = last.value - avg;
      document.getElementById('statAvg').textContent     = `${sign(diff)}${fmt(diff)}`;
      document.getElementById('statAvgDiff').textContent = `vs. hist. snitt (${fmt(avg)})`;
      document.getElementById('statAvgDiff').className   = `sub ${diff >= 0 ? 'up' : 'down'}`;
    }
    document.getElementById('statMax').textContent = `Maks: ${fmt(s.maxBand[wi])}`;
    document.getElementById('statMin').textContent = `Min: ${fmt(s.minBand[wi])}`;
  }
}

function renderSeasonalChart(s, label) {
  const canvas = document.getElementById('mainChart');
  canvas.style.display = 'block';

  const yFrom = s.prevYears.length ? s.prevYears[s.prevYears.length - 1] : '';
  const yTo   = s.prevYears.length ? s.prevYears[0] : '';
  document.getElementById('chartTitle').textContent =
    `${label} — ${s.currentYear} vs. historisk band (${yFrom}–${yTo})`;

  if (mainChart) mainChart.destroy();

  mainChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: s.xLabels,
      datasets: [
        {
          label: `Maks ${yFrom}–${yTo}`,
          data: s.maxBand,
          borderColor: 'rgba(99,130,220,0.3)',
          backgroundColor: 'rgba(79,110,247,0.15)',
          borderWidth: 1,
          fill: '+1',
          pointRadius: 0,
          tension: 0.4,
          order: 2,
        },
        {
          label: `Min ${yFrom}–${yTo}`,
          data: s.minBand,
          borderColor: 'rgba(99,130,220,0.3)',
          backgroundColor: 'transparent',
          borderWidth: 1,
          fill: false,
          pointRadius: 0,
          tension: 0.4,
          order: 2,
        },
        {
          label: String(s.currentYear),
          data: s.currentLine,
          borderColor: '#fb923c',
          backgroundColor: 'transparent',
          borderWidth: 2.5,
          fill: false,
          pointRadius: 3,
          pointHoverRadius: 6,
          tension: 0.3,
          spanGaps: false,
          order: 1,
        },
      ],
    },
    options: chartOptions({
      filter: item => item.datasetIndex !== 1,
    }),
  });
}

function renderHistoricChart(data, label, yearsBack) {
  const canvas = document.getElementById('mainChart');
  canvas.style.display = 'block';

  const cutoff = new Date();
  cutoff.setFullYear(cutoff.getFullYear() - yearsBack);
  const visible = data.filter(d => d.date >= cutoff.toISOString().slice(0, 10));

  document.getElementById('chartTitle').textContent =
    `${label} — historisk (siste ${yearsBack} år)`;

  if (mainChart) mainChart.destroy();

  mainChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: visible.map(d => d.date),
      datasets: [{
        label,
        data: visible.map(d => d.value),
        borderColor: '#4f6ef7',
        backgroundColor: 'rgba(79,110,247,0.1)',
        fill: true,
        tension: 0.3,
        pointRadius: 0,
        pointHoverRadius: 5,
        borderWidth: 2,
      }],
    },
    options: chartOptions({}),
  });
}

function chartOptions({ filter } = {}) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: {
        labels: {
          color: '#94a3b8',
          font: { size: 12 },
          ...(filter ? { filter } : {}),
        },
      },
      tooltip: {
        callbacks: {
          label: ctx => {
            const v = ctx.parsed.y;
            if (v == null) return null;
            return ` ${ctx.dataset.label}: ${fmt(v)} tusen fat`;
          },
        },
      },
    },
    scales: {
      x: {
        ticks: { color: '#475569', maxTicksLimit: 13, font: { size: 11 } },
        grid: { color: '#1e2235' },
      },
      y: {
        ticks: { color: '#475569', callback: v => fmt(v), font: { size: 11 } },
        grid: { color: '#1e2235' },
      },
    },
  };
}

function renderDeltaChart(data) {
  const canvas = document.getElementById('deltaChart');
  canvas.style.display = 'block';
  if (deltaChart) deltaChart.destroy();

  const labels = [], deltas = [], colors = [];
  for (let i = 1; i < data.length; i++) {
    const d = data[i].value - data[i - 1].value;
    labels.push(data[i].date);
    deltas.push(d);
    colors.push(d >= 0 ? 'rgba(74,222,128,0.75)' : 'rgba(248,113,113,0.75)');
  }

  deltaChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [{ data: deltas, backgroundColor: colors, borderWidth: 0 }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ` ${sign(ctx.parsed.y)}${fmt(ctx.parsed.y)} tusen fat`,
          },
        },
      },
      scales: {
        x: { ticks: { color: '#475569', maxTicksLimit: 14, font: { size: 11 } }, grid: { display: false } },
        y: { ticks: { color: '#475569', callback: v => fmt(v), font: { size: 11 } }, grid: { color: '#1e2235' } },
      },
    },
  });
}

function showLoading(on) {
  document.getElementById('loadingMsg').style.display = on ? 'block' : 'none';
  if (on) {
    document.getElementById('mainChart').style.display  = 'none';
    document.getElementById('deltaChart').style.display = 'none';
  }
}

function hideError() {
  const el = document.getElementById('errorBox');
  el.style.display = 'none';
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.className = 'error-box';
  el.textContent = `Feil: ${msg}`;
  el.style.display = 'block';
}

window.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
