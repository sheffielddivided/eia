<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europeisk gasslager – Fyllingsgrad</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --muted: #8b949e;
            --accent: #388bfd;
            --accent-dim: rgba(56,139,253,0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            max-width: 980px;
            margin: 0 auto;
        }
        header { margin-bottom: 1.5rem; }
        h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.2rem; }
        .subtitle { font-size: 0.8rem; color: var(--muted); }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }
        .btn {
            padding: 0.38rem 0.9rem;
            font-size: 0.82rem;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--muted);
            cursor: pointer;
            transition: border-color .15s, color .15s, background .15s;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 500;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
        }
        .chart-wrapper {
            position: relative;
            height: 420px;
        }
        @media (max-width: 600px) {
            body { padding: 1rem; }
            .chart-wrapper { height: 260px; }
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(22,27,34,.85);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: .85rem;
            color: var(--muted);
            gap: .6rem;
        }
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay.hidden { display: none; }

        .error-box {
            display: none;
            margin-top: 1rem;
            padding: .7rem 1rem;
            background: rgba(248,81,73,.1);
            border: 1px solid rgba(248,81,73,.3);
            border-radius: 6px;
            font-size: .82rem;
            color: #f85149;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: .75rem;
            margin-top: 1rem;
        }
        .stat {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: .7rem 1rem;
        }
        .stat-label {
            font-size: .7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: .3rem;
        }
        .stat-value { font-size: 1.45rem; font-weight: 600; letter-spacing: -.02em; }
        .stat-sub { font-size: .72rem; color: var(--muted); margin-top: .15rem; }

        footer {
            margin-top: 1.25rem;
            font-size: .72rem;
            color: var(--muted);
        }
        footer a { color: var(--muted); }
    </style>
</head>
<body>

<header>
    <h1>Europeisk gasslager</h1>
    <p class="subtitle">Fyllingsgrad i % av kapasitet &mdash; data fra AGSI+ / Gas Infrastructure Europe</p>
</header>

<div class="controls" id="controls">
    <button class="btn active" data-key="eu">Europa (total)</button>
    <button class="btn" data-key="de">Tyskland</button>
    <button class="btn" data-key="it">Italia</button>
    <button class="btn" data-key="nl">Nederland</button>
    <button class="btn" data-key="fr">Frankrike</button>
</div>

<div class="card">
    <div class="chart-wrapper">
        <canvas id="myChart"></canvas>
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
            Laster data&hellip;
        </div>
    </div>
    <div class="error-box" id="errorBox"></div>
    <div class="stats-grid" id="statsGrid"></div>
</div>

<footer>
    Kilde: <a href="https://agsi.gie.eu" target="_blank" rel="noopener">AGSI+ / Gas Infrastructure Europe</a>.
    Oppdateres daglig med 1&ndash;2 dagers forsinkelse.
</footer>

<script>
const API_KEY    = 'eb259b94628dbfddbaff45e4b3f772a2';
const BASE_URL   = 'https://agsi.gie.eu/api';
const CUR_YEAR   = new Date().getFullYear();
const HIST_YEARS = [CUR_YEAR-5, CUR_YEAR-4, CUR_YEAR-3, CUR_YEAR-2, CUR_YEAR-1];
const MONTHS     = ['Jan','Feb','Mar','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Des'];

// 366 MM-DD keys using 2000 (leap year) as template
const DAY_KEYS = (() => {
    const keys = [], d = new Date(2000, 0, 1);
    while (d.getFullYear() === 2000) {
        keys.push(
            String(d.getMonth()+1).padStart(2,'0') + '-' +
            String(d.getDate()).padStart(2,'0')
        );
        d.setDate(d.getDate()+1);
    }
    return keys;
})();

const SELECTIONS = {
    eu: { label: 'Europa (total)', country: null },   // no country param = EU aggregate
    de: { label: 'Tyskland',       country: 'DE' },
    it: { label: 'Italia',         country: 'IT' },
    nl: { label: 'Nederland',      country: 'NL' },
    fr: { label: 'Frankrike',      country: 'FR' },
};

const cache = {};
let chartInstance = null;

async function fetchYear(selKey, year) {
    const id = `${selKey}-${year}`;
    if (cache[id]) return cache[id];

    const sel  = SELECTIONS[selKey];
    const from = `${year}-01-01`;
    const to   = year === CUR_YEAR
        ? new Date().toISOString().slice(0,10)
        : `${year}-12-31`;

    const params = new URLSearchParams({ from, to, size: '400' });
    if (sel.country) params.set('country', sel.country);
    const url = `${BASE_URL}?${params}`;

    const resp = await fetch(url, { headers: { 'x-key': API_KEY } });
    if (!resp.ok) {
        throw new Error(`HTTP ${resp.status} fra AGSI API (${selKey}/${year})`);
    }

    const json = await resp.json();
    const records = Array.isArray(json.data) ? json.data : [];
    console.log(`[AGSI] ${selKey}/${year}: ${records.length} records, url=${url}`, records[0] ?? '(tom)');

    const map = {};
    for (const r of records) {
        const dateStr = r.gasDayStart || r.gas_day || r.date || '';
        if (!dateStr) continue;
        const mmdd = dateStr.slice(5, 10); // "YYYY-MM-DD" → "MM-DD"
        const val  = parseFloat(r.full);
        if (!isNaN(val)) map[mmdd] = val;
    }

    cache[id] = map;
    return map;
}

async function loadAndRender(selKey) {
    const loadingEl = document.getElementById('loading');
    const errorEl   = document.getElementById('errorBox');
    const statsEl   = document.getElementById('statsGrid');

    loadingEl.classList.remove('hidden');
    errorEl.style.display = 'none';
    statsEl.innerHTML = '';

    try {
        const [curMap, ...histMaps] = await Promise.all([
            fetchYear(selKey, CUR_YEAR),
            ...HIST_YEARS.map(y => fetchYear(selKey, y)),
        ]);

        const curData = DAY_KEYS.map(k => curMap[k] ?? null);
        const minData = DAY_KEYS.map(k => {
            const vals = histMaps.map(m => m[k]).filter(v => v != null);
            return vals.length ? Math.min(...vals) : null;
        });
        const maxData = DAY_KEYS.map(k => {
            const vals = histMaps.map(m => m[k]).filter(v => v != null);
            return vals.length ? Math.max(...vals) : null;
        });

        const now      = new Date();
        const todayKey = String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
        const todayIdx = DAY_KEYS.indexOf(todayKey);

        renderChart(curData, minData, maxData, todayIdx);
        renderStats(curData, minData, maxData);
    } catch (err) {
        errorEl.textContent = `Feil ved henting av data: ${err.message}`;
        errorEl.style.display = 'block';
        console.error(err);
    } finally {
        loadingEl.classList.add('hidden');
    }
}

function renderChart(curData, minData, maxData, todayIdx) {
    const ctx = document.getElementById('myChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    const xLabels = DAY_KEYS.map(k =>
        k.endsWith('-01') ? MONTHS[parseInt(k.slice(0,2))-1] : ''
    );

    const histLabel = `Spenn ${HIST_YEARS[0]}–${HIST_YEARS[HIST_YEARS.length-1]}`;

    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: xLabels,
            datasets: [
                {
                    // Upper bound of area — hidden from legend
                    label: '_max',
                    data: maxData,
                    borderColor: 'transparent',
                    backgroundColor: 'rgba(56,139,253,0.18)',
                    pointRadius: 0,
                    fill: false,
                    tension: 0.35,
                    spanGaps: true,
                    order: 3,
                },
                {
                    // Lower bound fills to upper bound, creating the band
                    label: histLabel,
                    data: minData,
                    borderColor: 'transparent',
                    backgroundColor: 'rgba(56,139,253,0.18)',
                    pointRadius: 0,
                    fill: '-1',
                    tension: 0.35,
                    spanGaps: true,
                    order: 3,
                },
                {
                    label: String(CUR_YEAR),
                    data: curData,
                    borderColor: '#388bfd',
                    backgroundColor: 'transparent',
                    pointRadius: 0,
                    borderWidth: 2.5,
                    fill: false,
                    tension: 0.3,
                    spanGaps: false,
                    order: 1,
                },
            ],
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: {
                    display: true,
                    labels: {
                        color: '#8b949e',
                        boxWidth: 14,
                        boxHeight: 14,
                        padding: 16,
                        font: { size: 12 },
                        // Hide the invisible max dataset from legend
                        filter: item => !item.text.startsWith('_'),
                    },
                },
                tooltip: {
                    backgroundColor: '#1c2129',
                    borderColor: '#30363d',
                    borderWidth: 1,
                    titleColor: '#8b949e',
                    bodyColor: '#c9d1d9',
                    callbacks: {
                        title: items => DAY_KEYS[items[0].dataIndex] || '',
                        label: item => {
                            if (item.raw == null || item.dataset.label.startsWith('_')) return null;
                            return `  ${item.dataset.label}: ${item.raw.toFixed(1)} %`;
                        },
                    },
                },
                annotation: {
                    annotations: todayIdx >= 0 ? {
                        todayLine: {
                            type: 'line',
                            xMin: todayIdx,
                            xMax: todayIdx,
                            borderColor: 'rgba(200,200,200,0.3)',
                            borderWidth: 1,
                            borderDash: [4, 4],
                            label: {
                                display: true,
                                content: 'I dag',
                                color: '#8b949e',
                                font: { size: 10 },
                                position: 'start',
                                backgroundColor: 'transparent',
                                padding: 2,
                            },
                        },
                    } : {},
                },
            },
            scales: {
                x: {
                    grid: { color: '#21262d', tickLength: 0 },
                    ticks: {
                        color: '#8b949e',
                        font: { size: 11 },
                        maxRotation: 0,
                        autoSkip: false,
                        callback: (_, idx) => xLabels[idx] || null,
                    },
                },
                y: {
                    min: 0,
                    max: 100,
                    grid: { color: '#21262d' },
                    ticks: {
                        color: '#8b949e',
                        font: { size: 11 },
                        callback: v => v + '%',
                    },
                },
            },
        },
    });
}

function renderStats(curData, minData, maxData) {
    let latestVal = null, latestIdx = -1;
    for (let i = curData.length - 1; i >= 0; i--) {
        if (curData[i] != null) { latestVal = curData[i]; latestIdx = i; break; }
    }
    if (latestVal == null) return;

    const histMin  = minData[latestIdx];
    const histMax  = maxData[latestIdx];
    const dateStr  = DAY_KEYS[latestIdx];

    let statusColor = '#d29922'; // within range
    let statusText  = 'Innenfor 5-årsintervall';
    if (histMin != null && latestVal < histMin) {
        statusColor = '#f85149'; statusText = 'Under 5-årsminimum';
    } else if (histMax != null && latestVal > histMax) {
        statusColor = '#3fb950'; statusText = 'Over 5-årsmaksimum';
    }

    document.getElementById('statsGrid').innerHTML = `
        <div class="stat">
            <div class="stat-label">Siste måling</div>
            <div class="stat-value">${latestVal.toFixed(1)} %</div>
            <div class="stat-sub">${dateStr} ${CUR_YEAR}</div>
        </div>
        <div class="stat">
            <div class="stat-label">5-årsminimum (${dateStr})</div>
            <div class="stat-value">${histMin != null ? histMin.toFixed(1)+' %' : '—'}</div>
        </div>
        <div class="stat">
            <div class="stat-label">5-årsmaksimum (${dateStr})</div>
            <div class="stat-value">${histMax != null ? histMax.toFixed(1)+' %' : '—'}</div>
        </div>
        <div class="stat">
            <div class="stat-label">Status</div>
            <div class="stat-value" style="font-size:.95rem;line-height:1.3;color:${statusColor}">${statusText}</div>
        </div>
    `;
}

document.getElementById('controls').addEventListener('click', e => {
    const btn = e.target.closest('.btn[data-key]');
    if (!btn) return;
    document.querySelectorAll('#controls .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadAndRender(btn.dataset.key);
});

loadAndRender('eu');
</script>
</body>
</html>
