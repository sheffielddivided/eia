name: Update gas storage data

on:
  schedule:
    - cron: '7 2 * * *'   # target ~04:07 Europe/Oslo; GitHub's scheduler can delay
                           # this by hours, so the job itself (not this time) is what
                           # guarantees it only actually fetches once per UTC day
  workflow_dispatch:         # manual trigger always runs, regardless of today's state

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Skip if already updated today (scheduled runs only)
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding regardless of last update."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            TODAY=$(date -u +%F)
            LAST=$(python3 -c "import json; print(json.load(open('data/agsi.json')).get('updatedAt','')[:10])" 2>/dev/null || true)
            if [ "$LAST" = "$TODAY" ]; then
              echo "Already updated today ($TODAY) — skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "Last update: ${LAST:-none}, today: $TODAY — proceeding."
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Fetch AGSI + ALSI data
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/fetch-gas-data.py

      - name: Fetch TTF price data
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/fetch-ttf-price.py

      - name: Commit if changed
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/agsi.json data/alsi.json data/ttf_price.json
          git diff --staged --quiet \
            || git commit -m "chore: update gas storage data [skip ci]" \
            && git push
