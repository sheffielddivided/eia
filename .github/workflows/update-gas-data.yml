name: Update gas storage data

on:
  schedule:
    - cron: '0 2 * * *'   # EEX's TTF CSV is republished daily at ~04:20 UTC
                           # (confirmed via its Last-Modified header), so the
                           # previous day's TTF price isn't available before
                           # that. GitHub delays scheduled runs here by ~4-7h
                           # in practice (19:00 cron -> 23:14 actual on one
                           # measured day), so 02:00 is chosen to land the
                           # actual execution around ~06:00-09:00 UTC -- after
                           # EEX's publish, not before it. A 19:00 cron was
                           # tried first on the (wrong) assumption that later
                           # is simply better; it actually landed same-day
                           # ~23:00 UTC, well before that night's 04:20 publish,
                           # so it kept missing the previous day's price. The
                           # once-per-day guard below (not this time) is what
                           # actually ensures exactly one fetch per UTC day.
  workflow_dispatch:         # manual trigger always runs, regardless of today's state

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Skip if already updated today (scheduled runs only)
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding regardless of last update."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            TODAY=$(date -u +%F)
            LAST=$(python3 -c "import json; print(json.load(open('data/agsi.json')).get('updatedAt','')[:10])" 2>/dev/null || true)
            if [ "$LAST" = "$TODAY" ]; then
              echo "Already updated today ($TODAY) — skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "Last update: ${LAST:-none}, today: $TODAY — proceeding."
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Fetch AGSI + ALSI data
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/fetch-gas-data.py

      - name: Fetch TTF price data
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/fetch-ttf-price.py

      - name: Fetch TTF futures data (Yahoo Finance)
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        run: python3 scripts/fetch-ttf-futures.py

      - name: Commit if changed
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/agsi.json data/alsi.json data/ttf_price.json data/ttf_futures.json
          if git diff --staged --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "chore: update gas storage data [skip ci]"
          # The other data workflow may have pushed meanwhile; rebase and retry
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 3))
          done
          exit 1
