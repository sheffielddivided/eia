name: Update Eurostat gas consumption

on:
  schedule:
    - cron: '30 3 * * *'   # daily; Eurostat releases monthly gas balances on
                            # irregular dates, so a cheap daily check picks
                            # new months up within a day of publication
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch Eurostat gas balances (nrg_cb_gas + nrg_cb_gasm)
        run: python3 scripts/fetch-eurostat-gas.py

      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # updatedAt changes on every run; only commit when the data itself changed
          if git diff --quiet -- data/eurostat/ 2>/dev/null; then echo "No changes"; exit 0; fi
          python3 - <<'EOF' || { echo "Only timestamp changed"; git checkout -- data/eurostat/; exit 0; }
          import json, subprocess, sys
          old = subprocess.run(['git', 'show', 'HEAD:data/eurostat/gas_consumption.json'],
                               capture_output=True, text=True)
          if old.returncode != 0:
              sys.exit(0)  # first commit of the file
          a = json.loads(old.stdout); b = json.load(open('data/eurostat/gas_consumption.json'))
          a.pop('updatedAt', None); b.pop('updatedAt', None)
          sys.exit(0 if a != b else 1)
          EOF
          if git diff --quiet -- data/eurostat/; then exit 0; fi
          git add data/eurostat/
          git commit -m "chore: update Eurostat gas consumption data [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 3))
          done
          exit 1
